name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            runner: ubuntu-latest
            build-mode: none
          - language: javascript-typescript
            runner: ubuntu-latest
            build-mode: none
          - language: c-cpp
            runner: ubuntu-latest
            build-mode: none
          - language: swift
            runner: macos-latest
            build-mode: manual
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build Swift helper for analysis
        if: matrix.language == 'swift'
        working-directory: native/CodexMicroVirtualHID
        # Invoke the toolchain directly so macOS system wrappers cannot drop
        # the environment CodeQL needs to trace the compiler.
        run: |
          swift_compiler="$(xcrun --find swiftc)"
          macos_sdk="$(xcrun --sdk macosx --show-sdk-path)"
          "$CODEQL_DIST/codeql" database trace-command \
            --working-dir="$PWD" "$CODEQL_EXTRACTOR_SWIFT_WIP_DATABASE" -- \
            "$swift_compiler" -O -sdk "$macos_sdk" \
            -import-objc-header IOHIDUserDeviceShim.h \
            -framework IOKit -framework CoreFoundation -framework Foundation \
            main.swift -o CodexMicroVirtualHID
      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
