name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            runner: ubuntu-latest
            build-mode: none
          - language: javascript-typescript
            runner: ubuntu-latest
            build-mode: none
          - language: c-cpp
            runner: ubuntu-latest
            build-mode: none
          - language: swift
            runner: macos-15
            build-mode: manual
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift analysis toolchain
        if: matrix.language == 'swift'
        run: |
          echo 'DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer' >> "$GITHUB_ENV"
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build Swift helper for analysis
        if: matrix.language == 'swift'
        working-directory: native/CodexMicroVirtualHID
        # CodeQL's bundled Clang cannot import Xcode's precompiled bridging
        # header. Read the original header with -disable-bridging-pch instead.
        run: |
          swift_compiler="$(xcrun --find swiftc)"
          macos_sdk="$(xcrun --sdk macosx --show-sdk-path)"
          "$CODEQL_DIST/codeql" database trace-command \
            --working-dir="$PWD" "$CODEQL_EXTRACTOR_SWIFT_WIP_DATABASE" -- \
            "$swift_compiler" -O -disable-bridging-pch -sdk "$macos_sdk" \
            -import-objc-header IOHIDUserDeviceShim.h \
            -framework IOKit -framework CoreFoundation -framework Foundation \
            main.swift -o CodexMicroVirtualHID
          # Fail if the helper was built but CodeQL did not extract its source.
          test -s "$CODEQL_EXTRACTOR_SWIFT_TRAP_DIR/sources$PWD/main.swift.trap"
      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
